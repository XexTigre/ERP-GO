services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: erpgo
      POSTGRES_USER: erpgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Defina MIGRATOR_PASSWORD no arquivo .env}
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init/roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpgo -d erpgo"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://erp_app:${APP_PASSWORD:?Defina APP_PASSWORD}@db:5432/erpgo?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      DB_MAX_CONNS: ${DB_MAX_CONNS:-12}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
