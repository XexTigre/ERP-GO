services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: erpgo
      POSTGRES_USER: erpgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpgo -d erpgo"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
